name: Release candidate

on:
  push:
    tags:
      - "v*-rc.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release-candidate tag
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-release:
    if: github.event_name == 'push' || inputs.tag == 'v0.2.0-rc.1'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          PUSH_TAG: ${{ github.ref_name }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "tag=${PUSH_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${MANUAL_TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the complete release gate
        run: npm run release:verify

      - name: Build release assets
        shell: bash
        run: |
          mkdir -p release-assets
          npm pack --pack-destination release-assets
          cp media/atlaspec-60s-demo.mp4 release-assets/
          cp media/atlaspec-60s-poster.png release-assets/
          cp media/atlaspec-60s-demo.srt release-assets/
          (
            cd release-assets
            sha256sum \
              atlaspec-*.tgz \
              atlaspec-60s-demo.mp4 \
              atlaspec-60s-demo.srt \
              atlaspec-60s-poster.png \
              > SHA256SUMS.txt
          )

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "Atlaspec 0.2.0-rc.1 — research preview" \
              --notes-file docs/RELEASE_NOTES_0.2.0-rc.1.md
            gh release upload "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              release-assets/*
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --prerelease \
              --title "Atlaspec 0.2.0-rc.1 — research preview" \
              --notes-file docs/RELEASE_NOTES_0.2.0-rc.1.md \
              release-assets/*
          fi
