version: "0.2"
map: operations-overview
title: Flood risk and emergency shelter capacity
description: Compare flood risk while locating high-capacity shelters.

intent:
  task: compare
  audience: operations
  primary_message: Prioritize high-risk districts and the shelters that can support them.

data:
  sources:
    - id: districts
      type: geojson
      url: ./data/districts.geojson
    - id: shelters
      type: geojson
      url: ./data/shelters.geojson
  fields:
    flood_probability:
      source: districts
      path: flood_probability
      measurement: quantitative
      semantic_type: probability
      unit: ratio
      normalization: ratio
      range: [0, 1]
    district_name:
      source: districts
      path: name
      measurement: nominal
      semantic_type: label
    capacity:
      source: shelters
      path: capacity
      measurement: quantitative
      semantic_type: capacity
      unit: people
      normalization: none
      range: [0, 1000]
    shelter_name:
      source: shelters
      path: name
      measurement: nominal
      semantic_type: label

layers:
  - id: flood-risk
    purpose: primary
    family: choropleth
    encoding:
      geometry: {source: districts, support: polygon}
      color: {field: flood_probability, classification: continuous}
      label: {field: district_name}
    constraints:
      missing_data: explicit
      raw_count_choropleth: reject
  - id: shelters
    purpose: supporting
    family: proportional-symbol
    encoding:
      geometry: {source: shelters, support: point}
      size: {field: capacity}
      label: {field: shelter_name}
    constraints:
      missing_data: error
    behavior:
      zoom_rules:
        - {max_zoom: 9, target: symbols, action: cluster}
        - {min_zoom: 12, target: labels, action: show-labels}

constraints:
  colorblind_safe: true
  protected_layers: [shelters]
  label_priority: [shelter_name, district_name]
  viewport: {width: 960, height: 640}

basemap: {style: minimal-light, contrast: light}
